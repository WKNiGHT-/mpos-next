<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Belt-and-braces: deny direct access to source dirs even if .htaccess
    # is bypassed by a misconfiguration. NOTE: upstream relocated the
    # legacy public/include/ tree to a top-level include/, so it's already
    # outside the document root. The `include` rule here covers any
    # accidental re-introduction inside public/.
    <DirectoryMatch "^/var/www/html/(cronjobs|scripts|sql|docker|vendor|include|tests|upgrade|logs)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
