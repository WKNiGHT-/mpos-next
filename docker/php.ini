; MPOS local-dev php.ini overrides.
; Production deployments should override these.

; --- Errors -----------------------------------------------------------------
; Display is OFF so deprecation warnings during early bootstrap don't
; spill into the response body and trigger "headers already sent" before
; session_start() runs. All errors still go to stderr (visible via
; `make logs-web`) so devs see them — they just don't pollute output.
display_errors          = Off
display_startup_errors  = Off
error_reporting         = E_ALL
log_errors              = On
error_log               = /proc/self/fd/2

; --- Time/locale ------------------------------------------------------------
date.timezone           = UTC

; --- Sessions ---------------------------------------------------------------
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; --- Limits -----------------------------------------------------------------
memory_limit            = 512M
post_max_size           = 32M
upload_max_filesize     = 32M
max_execution_time      = 120

; --- Opcache (dev: revalidate frequently so edits show up) ------------------
opcache.enable                  = 1
opcache.enable_cli              = 1
opcache.memory_consumption      = 256
opcache.max_accelerated_files   = 20000
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 0
